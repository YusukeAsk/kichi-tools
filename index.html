<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仕事の便利ツール｜無料・登録不要・ファイルは外に送りません</title>
<meta name="description" content="PDFの結合やCSVの文字化け直しなど、仕事でよく使う道具を集めました。どの道具も、ファイルをあなたのブラウザの中だけで処理します。">
<style>
  :root {
    --side: #1f2328;
    --side-ink: #c9d1d9;
    --side-sub: #7d8590;
    --side-hover: #2a3038;
    --side-active: #2f6f5e;
    --top: #16191d;
    --bg: #f3f4f6;
    --card: #ffffff;
    --ink: #1f2328;
    --sub: #656d76;
    --line: #d8dee4;
    --accent: #2f6f5e;
    --accent-soft: #e3efea;
    --warn-soft: #fff8e1;
    --warn: #8a6d00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1215; --card: #171b20; --ink: #e6edf3; --sub: #8b949e;
      --line: #2d333b; --accent: #6fb39f; --accent-soft: #1d2b27;
      --warn-soft: #2b2610; --warn: #d4b84a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    font-size: 14px; line-height: 1.7;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { flex-shrink: 0; }

  /* ===== 全体の枠 ===== */
  .app { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 48px 1fr; min-height: 100vh; }

  /* 上のバー */
  .top {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: var(--top); color: #f0f3f6;
  }
  .menu-btn { display: none; padding: 6px; margin-left: -6px; border-radius: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .04em; color: inherit; text-decoration: none; }
  .brand i { width: 26px; height: 26px; display: grid; place-items: center; background: var(--side-active); border-radius: 6px; }
  .safe { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9fb7ae; }

  /* 左メニュー */
  .side { background: var(--side); color: var(--side-ink); padding: 12px 0 24px; overflow-y: auto; }
  .group { padding: 14px 20px 6px; font-size: 11px; letter-spacing: .12em; color: var(--side-sub); }
  .nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 20px; color: var(--side-ink); text-decoration: none;
    border-left: 3px solid transparent;
  }
  .nav a:hover { background: var(--side-hover); }
  .nav a.on { background: var(--side-hover); border-left-color: var(--side-active); color: #fff; }

  /* 作業エリア */
  .main { padding: 24px 32px 48px; min-width: 0; }
  .crumb { font-size: 12px; color: var(--sub); }
  .crumb a { color: var(--sub); }
  h1 { margin-top: 4px; font-size: 22px; font-weight: 700; }
  .desc { margin-top: 2px; color: var(--sub); }

  .panel {
    margin-top: 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 700;
  }
  .panel-body { padding: 20px 16px; }

  .notice {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px; border-radius: 6px;
    background: var(--warn-soft); color: var(--warn); font-size: 13px;
  }
  .drop {
    margin-top: 16px; padding: 40px 16px; text-align: center;
    border: 2px dashed var(--line); border-radius: 8px; color: var(--sub);
  }
  .actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
  .btn {
    padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); font-size: 13px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ホームの一覧 */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card {
    display: flex; gap: 12px; align-items: flex-start; text-align: left;
    padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: inherit; text-decoration: none;
  }
  .card:hover { border-color: var(--accent); }
  .card i { flex-shrink: 0; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
  .card b { display: block; font-size: 14px; }
  .card span { display: block; font-size: 12px; color: var(--sub); line-height: 1.5; }

  .status { font-size: 11px; font-weight: 400; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--sub); }

  /* スマホ：左メニューを引き出し式に */
  .shade { display: none; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .menu-btn { display: block; }
    .safe span { display: none; }
    .side {
      position: fixed; top: 48px; bottom: 0; left: 0; width: 260px; z-index: 20;
      transform: translateX(-100%); transition: transform .2s ease;
    }
    .app.open .side { transform: none; }
    .app.open .shade { display: block; position: fixed; inset: 48px 0 0 0; background: rgba(0,0,0,.4); z-index: 10; }
    .main { padding: 20px 16px 40px; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開く">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#home">
      <i><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></i>
      仕事の便利ツール
    </a>
    <div class="safe" title="どの道具も、ファイルはブラウザの中だけで処理します">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>無料・登録不要・ファイルは外に送りません</span>
    </div>
  </header>

  <nav class="side" id="side" aria-label="道具箱"></nav>
  <div class="shade" id="shade"></div>

  <main class="main" id="main"></main>

</div>

<script>
  // 道具箱の中身（増やすときはここに足す）
  const ICON = {
    home:  '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    pdf:   '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 14h6M9 17h4"/>',
    csv:   '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
    text:  '<path d="M4 7V5h16v2M9 19h6M12 5v14"/>',
    diff:  '<path d="M8 3v12M5 12l3 3 3-3M16 21V9M13 12l3-3 3 3"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
    pin:   '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><path d="M4 4l16 16"/>',
    cal:   '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    era:   '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>'
  };
  const GROUPS = [
    { name: "PDF", tools: [
      { id: "pdf-merge", icon: "pdf", name: "PDFの結合", desc: "複数のPDFを1つにまとめる。並べ替え・ページ削除も", input: "PDFファイル" }
    ]},
    { name: "データ・文章", tools: [
      { id: "csv-encoding", icon: "csv", name: "CSVの文字化け直し", desc: "Shift_JIS と UTF-8 を変換して、Excelでも文字化けしないCSVに", input: "CSVファイル" },
      { id: "zenkaku", icon: "text", name: "全角・半角のそろえ直し", desc: "英数字・カナ・空白・改行をまとめて整える", input: "文章" },
      { id: "diff", icon: "diff", name: "文章の差分チェック", desc: "2つの文章の違うところを色分けして見せる", input: "2つの文章" }
    ]},
    { name: "画像", tools: [
      { id: "image-resize", icon: "image", name: "画像の縮小・圧縮", desc: "メールやサイトに上げられるサイズに小さくする", input: "画像ファイル" },
      { id: "exif-remove", icon: "pin", name: "写真の位置情報を消す", desc: "撮影場所などの情報を消してから人に渡す", input: "写真" }
    ]},
    { name: "日付・計算", tools: [
      { id: "business-days", icon: "cal", name: "営業日の計算", desc: "土日・祝日を除いて「○営業日後」を出す", input: "日付" },
      { id: "wareki", icon: "era", name: "和暦・西暦の変換", desc: "年齢や期間の計算もあわせて", input: "日付" }
    ]}
  ];
  const ALL = GROUPS.flatMap(g => g.tools.map(t => ({ ...t, group: g.name })));
  const svg = (k, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

  // 左メニュー
  const side = document.getElementById("side");
  side.innerHTML =
    `<div class="nav"><a href="#home" data-id="home">${svg("home")}ホーム</a></div>` +
    GROUPS.map(g => `<div class="group">${g.name}</div><div class="nav">` +
      g.tools.map(t => `<a href="#${t.id}" data-id="${t.id}">${svg(t.icon)}${t.name}</a>`).join("") +
      `</div>`).join("");

  // 作業エリア
  const main = document.getElementById("main");
  function render() {
    const id = location.hash.slice(1) || "home";
    const tool = ALL.find(t => t.id === id);
    side.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.id === (tool ? id : "home")));

    if (!tool) {
      main.innerHTML = `
        <div class="crumb">ホーム</div>
        <h1>道具箱</h1>
        <div class="panel">
          <div class="panel-head">すべての道具 <span class="status">${ALL.length}件・すべて工事中</span></div>
          <div class="panel-body"><div class="cards">
            ${ALL.map(t => `<a class="card" href="#${t.id}"><i>${svg(t.icon, 18)}</i><div><b>${t.name}</b><span>${t.desc}</span></div></a>`).join("")}
          </div></div>
        </div>`;
    } else {
      main.innerHTML = `
        <div class="crumb"><a href="#home">ホーム</a> / ${tool.group} / ${tool.name}</div>
        <h1>${tool.name}</h1>
        <p class="desc">${tool.desc}</p>
        <div class="panel">
          <div class="panel-head">作業エリア <span class="status">工事中</span></div>
          <div class="panel-body">
            <div class="notice">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
              <div>この道具は、ただいま工事中です。できあがるまで、もうしばらくお待ちください。</div>
            </div>
            <div class="drop">ここに${tool.input}を入れる場所になります</div>
            <div class="actions"><button class="btn" disabled>クリア</button><button class="btn primary" disabled>実行する</button></div>
          </div>
        </div>`;
    }
    document.getElementById("app").classList.remove("open");
    main.scrollTop = 0; window.scrollTo(0, 0);
  }
  addEventListener("hashchange", render);
  render();

  // スマホのメニュー開閉
  document.getElementById("menuBtn").onclick = () => document.getElementById("app").classList.toggle("open");
  document.getElementById("shade").onclick = () => document.getElementById("app").classList.remove("open");
</script>
</body>
</html>
